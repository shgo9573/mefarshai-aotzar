name: Unzip and commit to repo

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "שם הקובץ zip שנמצא ברoot של הריפו"
        required: true
        default: "archive.zip"

jobs:
  unzip_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract zip file
        shell: bash
        run: |
          ZIP_FILE="${{ github.event.inputs.zip_name }}"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "הקובץ לא נמצא: $ZIP_FILE"
            exit 1
          fi

          echo "מחלצים את $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .

          echo "מוחקים את ה-ZIP לאחר החילוץ..."
          rm -f "$ZIP_FILE"

      - name: Commit extracted files to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "אין שינויים להעלאה."
            exit 0
          fi

          git commit -m "Extract zip archive and save contents"
          git push
